; PlatformIO project file for the BRZ CAN-to-BLE bridge.
;
; Board: LOLIN S3 Pro (ESP32-S3-WROOM-1, 16MB Quad flash / 8MB Octal PSRAM).
; There's no vendor board definition for this exact board in the espressif32
; platform, so we target the generic esp32-s3-devkitc-1 board and override
; the flash/PSRAM settings to match -- same approach already validated for
; the T-Energy-S3 elsewhere in this project (see T-Energy-S3/platformio.ini),
; which uses the same underlying ESP32-S3-WROOM-1-N16R8 module.
;
; See docs/D29-CAN-Bus-Power-Wiring.md for the wiring this firmware assumes
; (GPIO4/GPIO5 to the SN65HVD230, VIN pin for external 5V).

[env]
platform = espressif32 @6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 16MB
board_build.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; Serial over native USB; GPIO43/44 stay free either way since we don't use them.

lib_deps =
    https://github.com/timurrrr/arduino-RaceChrono.git
    h2zero/NimBLE-Arduino @ ^1.4.1

; The real firmware: TWAI in listen-only mode, per docs/D29-CAN-Bus-Power-Wiring.md
; section 6. This is what actually goes in the car.
[env:lolin_s3_pro]

; Bench smoke test only: transmits fake CAN frames to itself via TWAI's Self
; Reception Request, so BLE + the whole receive/PID/notify pipeline can be
; verified with zero extra hardware (no second board, no fake-car rig) before
; ever connecting to the car. See docs/D29-CAN-Bus-Power-Wiring.md section 8.
; Build/flash with: pio run -e lolin_s3_pro_selftest -t upload
; DO NOT install this build's firmware in the car.
[env:lolin_s3_pro_selftest]
build_flags =
    ${env.build_flags}
    -D CAN_BUS_SELF_TEST=1
